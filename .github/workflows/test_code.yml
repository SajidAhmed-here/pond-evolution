name: test_pond_evolution

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: pond-evolution

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      MPLBACKEND: Agg
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # game_test.py requires this exact directory name, including in forks.
          path: pond-evolution
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Match the development environment and the pinned binary packages.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pond-evolution/requirements_dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libtk8.6

      - name: Install Python dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          # This includes runtime dependencies; requirements.txt has conflicting pins.
          python -m pip install -r requirements_dev.txt
          python -m pip check

      - name: Check application imports
        run: python -c "import tkinter; from src.game import Game"

      - name: Unit tests
        run: python -m pytest tests/unit --verbose --timeout=60

      - name: Integration tests
        # Report integration failures even when a unit test has failed.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest tests/integration --verbose --timeout=60
